id: all_graalvm
namespace: sanitychecks.plugin-graalvm

tasks:
  - id: loop
    type: io.kestra.plugin.core.flow.Loop
    values:
      - graalvm_js
      - graalvm_python
      - graalvm_ruby
    tasks:
      - id: subflow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: "{{ item.value }}"
        namespace: "{{ flow.namespace }}"
